name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  IMAGE_NAME: felipebz/zpa-cli

jobs:
  release_please:
    name: Create or update Release Please draft
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ github.token }}

  publish:
    name: Validate and publish stable release
    if: needs.release_please.outputs.release_created == 'true'
    needs: release_please
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build_image.outputs.digest }}
      release_version: ${{ needs.release_please.outputs.version }}
    env:
      RELEASE_VERSION: ${{ needs.release_please.outputs.version }}
      RELEASE_TAG: ${{ needs.release_please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release_please.outputs.sha }}
          fetch-depth: 0

      - name: Verify exact Release Please commit
        env:
          RELEASE_SHA: ${{ needs.release_please.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ ${RELEASE_SHA} =~ ^[0-9a-f]{40}$ ]] || {
            printf 'Release Please returned an invalid commit SHA: %s\n' "${RELEASE_SHA}" >&2
            exit 1
          }
          [[ $(git rev-parse HEAD) == "${RELEASE_SHA}" ]] || {
            printf 'Checked out commit does not match Release Please SHA\n' >&2
            exit 1
          }

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: liberica
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Validate stable release versions
        shell: bash
        run: |
          set -euo pipefail

          project_version=$(./gradlew properties --console=plain | awk '$1 == "version:" { value=$2 } END { print value }')
          zpa_version=$(sed -n 's/^zpaVersion=//p' gradle.properties)

          [[ ${project_version} == "${RELEASE_VERSION}" ]] || {
            printf 'Gradle project version %s does not match Release Please version %s\n' "${project_version}" "${RELEASE_VERSION}" >&2
            exit 1
          }
          [[ ${RELEASE_TAG} == "${RELEASE_VERSION}" ]] || {
            printf 'Release tag %s does not match release version %s\n' "${RELEASE_TAG}" "${RELEASE_VERSION}" >&2
            exit 1
          }
          [[ ${RELEASE_VERSION} =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            printf 'Release version must be an unprefixed stable X.Y.Z: %s\n' "${RELEASE_VERSION}" >&2
            exit 1
          }
          [[ ${RELEASE_TAG} =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            printf 'Release tag must be an unprefixed stable X.Y.Z: %s\n' "${RELEASE_TAG}" >&2
            exit 1
          }
          [[ ${zpa_version} =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            printf 'zpaVersion must independently be a stable X.Y.Z: %s\n' "${zpa_version}" >&2
            exit 1
          }
          printf 'RELEASE_VERSION=%s\nRELEASE_TAG=%s\nzpaVersion=%s\n' "${RELEASE_VERSION}" "${RELEASE_TAG}" "${zpa_version}"

      - name: Build with Gradle
        run: ./gradlew build --refresh-dependencies

      - name: Assemble distributions
        run: ./gradlew copyJdksToCache jreleaserAssemble

      - name: Verify release distributions
        shell: bash
        run: |
          set -euo pipefail
          jlink_dir=build/jreleaser/assemble/zpa-cli/jlink
          expected=(
            "build/distributions/zpa-cli-${RELEASE_VERSION}.zip"
            "build/distributions/zpa-cli-${RELEASE_VERSION}.tar"
            "${jlink_dir}/zpa-cli-${RELEASE_VERSION}-osx-x86_64.tar.gz"
            "${jlink_dir}/zpa-cli-${RELEASE_VERSION}-osx-aarch_64.tar.gz"
            "${jlink_dir}/zpa-cli-${RELEASE_VERSION}-linux-x86_64.tar.gz"
            "${jlink_dir}/zpa-cli-${RELEASE_VERSION}-linux-aarch_64.tar.gz"
            "${jlink_dir}/zpa-cli-${RELEASE_VERSION}-linux_musl-x86_64.tar.gz"
            "${jlink_dir}/zpa-cli-${RELEASE_VERSION}-windows-x86_64.zip"
          )
          for file in "${expected[@]}"; do
            [[ -f ${file} ]] || {
              printf 'Expected release asset is missing: %s\n' "${file}" >&2
              exit 1
            }
          done
          [[ ! -e "${jlink_dir}/zpa-cli-${RELEASE_VERSION}-windows-x86_64.tar.gz" ]] || {
            printf 'Unexpected Windows TAR.GZ exists\n' >&2
            exit 1
          }
          for target in \
            osx-x86_64 \
            osx-aarch_64 \
            linux-x86_64 \
            linux-aarch_64 \
            linux_musl-x86_64; do
            [[ ! -e "${jlink_dir}/zpa-cli-${RELEASE_VERSION}-${target}.zip" ]] || {
              printf 'Unexpected ZIP exists for %s\n' "${target}" >&2
              exit 1
            }
          done

      - name: Render changelog
        run: ./gradlew jreleaserChangelog

      - name: Verify generated changelog
        shell: bash
        run: |
          set -euo pipefail
          changelog_file=build/jreleaser/release/CHANGELOG.md
          [[ -s ${changelog_file} ]] || {
            printf 'Generated changelog is missing or empty\n' >&2
            exit 1
          }
          changelog=$(<"${changelog_file}")
          zpa_version=$(sed -n 's/^zpaVersion=//p' gradle.properties)
          [[ ${changelog} == *"ZPA ${zpa_version}"* ]] || {
            printf 'Changelog does not contain zpaVersion %s\n' "${zpa_version}" >&2
            exit 1
          }
          [[ ${changelog} == *"https://github.com/felipebz/zpa/releases/tag/${zpa_version}"* ]] || {
            printf 'Changelog does not contain the rendered ZPA release link\n' >&2
            exit 1
          }
          assets=(
            "zpa-cli-${RELEASE_VERSION}.zip"
            "zpa-cli-${RELEASE_VERSION}.tar"
            "zpa-cli-${RELEASE_VERSION}-osx-x86_64.tar.gz"
            "zpa-cli-${RELEASE_VERSION}-osx-aarch_64.tar.gz"
            "zpa-cli-${RELEASE_VERSION}-linux-x86_64.tar.gz"
            "zpa-cli-${RELEASE_VERSION}-linux-aarch_64.tar.gz"
            "zpa-cli-${RELEASE_VERSION}-linux_musl-x86_64.tar.gz"
            "zpa-cli-${RELEASE_VERSION}-windows-x86_64.zip"
          )
          for asset in "${assets[@]}"; do
            [[ ${changelog} == *"${asset}"* ]] || {
              printf 'Changelog does not contain asset filename %s\n' "${asset}" >&2
              exit 1
            }
            url="https://github.com/felipebz/zpa-cli/releases/download/${RELEASE_VERSION}/${asset}"
            [[ ${changelog} == *"${url}"* ]] || {
              printf 'Changelog does not contain asset URL %s\n' "${url}" >&2
              exit 1
            }
          done

          previous_tag=$(git describe --tags --abbrev=0 HEAD^)
          has_conventional=false
          while IFS= read -r subject; do
            if [[ ${subject} =~ ^[a-z]+(\([^)]+\))?!?:[[:space:]]+ ]]; then
              has_conventional=true
              break
            fi
          done < <(git log --format=%s "${previous_tag}..HEAD")
          [[ ${has_conventional} == true ]] || {
            printf 'No Conventional Commit subject found between %s and HEAD\n' "${previous_tag}" >&2
            exit 1
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build stable digest-only Docker image
        id: build_image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64/v8
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Validate stable Docker digest
        env:
          DIGEST: ${{ steps.build_image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ ${DIGEST} =~ ^sha256:[0-9a-f]{64}$ ]] || {
            printf 'Buildx did not return a valid digest: %s\n' "${DIGEST}" >&2
            exit 1
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: utPLSQL/utPLSQL
          path: utplsql

      - name: Analyze with zpa-cli
        working-directory: utplsql
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/run-demo.sh" "${{ env.IMAGE_NAME }}@${{ steps.build_image.outputs.digest }}" "${GITHUB_WORKSPACE}/utplsql"

      - name: Analyze with SonarCloud
        uses: sonarsource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
        with:
          projectBaseDir: utplsql
          args: >
            -Dsonar.projectKey=utPLSQL-zpa-demo
            -Dsonar.organization=felipebz-github
            -Dsonar.externalIssuesReportPaths=zpa-issues.json
            -Dsonar.pullrequest.provider=
            -Dsonar.coverageReportPaths=
            -Dsonar.testExecutionReportPaths=
            -Dsonar.plsql.file.suffixes=sql,pkg,pks,pkb,fun,pcd,tgg,prc,tpb,trg,typ,tab,tps
            -Dsonar.scm.disabled=true
            -Dsonar.tests=
        env:
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}

      - name: Publish GitHub release draft
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          token: ${{ github.token }}
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: build/jreleaser/release/CHANGELOG.md
          fail_on_unmatched_files: true
          files: |
            build/distributions/zpa-cli-${{ env.RELEASE_VERSION }}.zip
            build/distributions/zpa-cli-${{ env.RELEASE_VERSION }}.tar
            build/jreleaser/assemble/zpa-cli/jlink/zpa-cli-${{ env.RELEASE_VERSION }}-osx-x86_64.tar.gz
            build/jreleaser/assemble/zpa-cli/jlink/zpa-cli-${{ env.RELEASE_VERSION }}-osx-aarch_64.tar.gz
            build/jreleaser/assemble/zpa-cli/jlink/zpa-cli-${{ env.RELEASE_VERSION }}-linux-x86_64.tar.gz
            build/jreleaser/assemble/zpa-cli/jlink/zpa-cli-${{ env.RELEASE_VERSION }}-linux-aarch_64.tar.gz
            build/jreleaser/assemble/zpa-cli/jlink/zpa-cli-${{ env.RELEASE_VERSION }}-linux_musl-x86_64.tar.gz
            build/jreleaser/assemble/zpa-cli/jlink/zpa-cli-${{ env.RELEASE_VERSION }}-windows-x86_64.zip

  promote-stable-docker:
    name: Promote stable Docker aliases
    needs: publish
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: felipebz/zpa-cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Promote immutable version
        run: |
          set -euo pipefail
          bash .github/scripts/promote-digest.sh "${IMAGE_NAME}" "${{ needs.publish.outputs.digest }}" "${IMAGE_NAME}:${{ needs.publish.outputs.release_version }}" true

      - name: Promote major-minor alias
        run: |
          set -euo pipefail
          version='${{ needs.publish.outputs.release_version }}'
          bash .github/scripts/promote-digest.sh "${IMAGE_NAME}" "${{ needs.publish.outputs.digest }}" "${IMAGE_NAME}:${version%.*}"

      - name: Promote major alias
        run: |
          set -euo pipefail
          version='${{ needs.publish.outputs.release_version }}'
          bash .github/scripts/promote-digest.sh "${IMAGE_NAME}" "${{ needs.publish.outputs.digest }}" "${IMAGE_NAME}:${version%%.*}"

      - name: Promote latest alias
        run: bash .github/scripts/promote-digest.sh "${IMAGE_NAME}" "${{ needs.publish.outputs.digest }}" "${IMAGE_NAME}:latest"
